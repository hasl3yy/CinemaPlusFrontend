<div class="salas-container">
  <div class="salas-header">
    <h2>Gestión de Salas</h2>
    <button (click)="volver()">← Volver</button>
  </div>

  <div class="form-sala">
    <div class="form-group">
      <label for="nombre">Nombre de la Sala</label>
      <input type="text" id="nombre" [(ngModel)]="nombre" name="nombre" placeholder="Ej. Sala 1" />
    </div>

    <button (click)="onGuardar()" [disabled]="cargando">
      {{ cargando ? 'Guardando...' : 'Guardar sala' }}
    </button>
  </div>

  <h3>Salas publicadas</h3>
  <div class="lista-salas">
    <div class="tarjeta-sala" *ngFor="let s of salas()">
      <div class="tarjeta-info">
        <h4>{{ s.nombre }}</h4>
        <p>Estado: {{ s.estado }}</p>
      </div>
      
      <div class="tarjeta-acciones">
        <!-- Botón para administrar las filas independientes de esta sala -->
        <button (click)="administrarFilas(s.id_sala)">Administrar filas</button>
      </div>
    </div>
  </div>
</div>
